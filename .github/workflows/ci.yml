name: CI

on:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest, macos-26-intel]

    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          # Only main writes. Branch runs read the cache but do not fill it,
          # which is what kept a 10 GB repo quota at 8.8 GB.
          save-if: ${{ github.ref == 'refs/heads/main' }}

      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf libssl-dev libasound2-dev

      - name: Build sidecar binaries
        shell: bash
        run: |
          cargo build -p focuser-cli
          mkdir -p crates/focuser-ui/binaries
          host=$(rustc -vV | awk '/^host:/ {print $2}')
          ext=""
          [ "${{ runner.os }}" = "Windows" ] && ext=".exe"
          for bin in focuser-cli; do
            cp "target/debug/$bin$ext" "crates/focuser-ui/binaries/$bin-$host$ext"
          done

      - name: Run tests
        run: cargo test --workspace --verbose

      - name: Run clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Check formatting
        run: cargo fmt --all -- --check

  build-check:
    name: Build check (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest, macos-26-intel]

    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          # Only main writes. Branch runs read the cache but do not fill it,
          # which is what kept a 10 GB repo quota at 8.8 GB.
          save-if: ${{ github.ref == 'refs/heads/main' }}

      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf libssl-dev libasound2-dev

      - name: Build sidecar binaries
        shell: bash
        run: |
          cargo build -p focuser-cli
          mkdir -p crates/focuser-ui/binaries
          host=$(rustc -vV | awk '/^host:/ {print $2}')
          ext=""
          [ "${{ runner.os }}" = "Windows" ] && ext=".exe"
          for bin in focuser-cli; do
            cp "target/debug/$bin$ext" "crates/focuser-ui/binaries/$bin-$host$ext"
          done

      - name: Build all crates
        run: cargo build --workspace

  frontend:
    name: Frontend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: crates/focuser-ui/frontend

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: crates/focuser-ui/frontend/package-lock.json

      - name: Install
        run: npm ci

      # `postinstall` already does this, but nothing else compiles without it,
      # so make the dependency visible rather than implicit in a lifecycle hook.
      - name: Compile messages
        run: npm run paraglide

      - name: Lint and format
        run: npx biome check .

      - name: Typecheck
        run: npx tsc --noEmit

      - name: Test
        run: npx vitest run

      - name: Build
        run: npx vite build

  bindings:
    name: Bindings are up to date
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable

      - name: Install Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf libssl-dev libasound2-dev

      # focuser-ui declares these as Tauri sidecars, so its build script
      # refuses to run until they exist — even though exporting bindings does
      # not use them.
      - name: Build sidecar binaries
        shell: bash
        run: |
          cargo build -p focuser-cli
          mkdir -p crates/focuser-ui/binaries
          host=$(rustc -vV | awk '/^host:/ {print $2}')
          for bin in focuser-cli; do
            cp "target/debug/$bin" "crates/focuser-ui/binaries/$bin-$host"
          done

      # Generated from Rust, so a stale committed copy means the frontend is
      # typechecking against a backend that no longer exists.
      - name: Regenerate
        run: cargo run -p focuser-ui -- --export-bindings

      - name: Check for drift
        run: git diff --exit-code -- crates/focuser-ui/frontend/src/bindings.ts

  extension:
    name: Extension
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: extension

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: extension/package-lock.json

      - name: Install
        run: npm ci

      - name: Typecheck
        run: npm run compile

      # The hostname rules here mirror focuser_common::host. If they drift,
      # which form the user typed starts to matter again.
      - name: Test
        run: npm test

      # Both targets, because the manifests differ and only a build catches a
      # config that is valid for one browser and not the other.
      - name: Build (Chrome)
        run: npm run build

      - name: Build (Firefox)
        run: npm run build:firefox

  package-macos:
    name: macOS DMG (${{ matrix.target }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-latest
            target: aarch64-apple-darwin
          - runner: macos-26-intel
            target: x86_64-apple-darwin
    runs-on: ${{ matrix.runner }}

    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Build CLI sidecar
        shell: bash
        run: |
          test "$(rustc -vV | awk '/^host:/ {print $2}')" = "${{ matrix.target }}"
          cargo build --locked --release --target "${{ matrix.target }}" -p focuser-cli
          mkdir -p crates/focuser-ui/binaries
          cp "target/${{ matrix.target }}/release/focuser-cli" "crates/focuser-ui/binaries/focuser-cli-${{ matrix.target }}"

      # The v2.10.1 x86_64 Darwin archive contains an ARM64 Mach-O binary; build
      # from source on Intel until the upstream asset is corrected.
      - name: Install Tauri CLI from source on Intel
        if: matrix.target == 'x86_64-apple-darwin'
        run: cargo install tauri-cli --locked --version 2.10.1

      - name: Install checksum-verified Tauri CLI on Apple Silicon
        if: matrix.target == 'aarch64-apple-darwin'
        shell: bash
        env:
          TAURI_TARGET: ${{ matrix.target }}
        run: |
          sha256=f89d7d9485d3a6a6bcbc88275b0bddea61fe582ca636fc02c286994af1f6e36b
          asset="cargo-tauri-${TAURI_TARGET}.zip"
          archive="$RUNNER_TEMP/$asset"
          url="https://github.com/tauri-apps/tauri/releases/download/tauri-cli-v2.10.1/$asset"
          curl --fail --location --silent --show-error "$url" --output "$archive"
          echo "$sha256  $archive" | shasum -a 256 --check --status
          install_dir="$RUNNER_TEMP/tauri-cli"
          mkdir -p "$install_dir"
          unzip -q "$archive" -d "$install_dir"
          chmod +x "$install_dir/cargo-tauri"
          echo "$install_dir" >> "$GITHUB_PATH"
          "$install_dir/cargo-tauri" --version

      - name: Build unsigned DMG without updater artifacts
        working-directory: crates/focuser-ui
        run: |
          cargo tauri build --target "${{ matrix.target }}" --bundles dmg --no-sign --ci --config '{"bundle":{"createUpdaterArtifacts":false}}'
          test -n "$(find ../../target/${{ matrix.target }}/release/bundle/dmg -maxdepth 1 -name '*.dmg' -print -quit)"

      - name: Upload unsigned macOS DMG
        uses: actions/upload-artifact@v4
        with:
          name: focusguard-macos-${{ matrix.target }}-unsigned-dmg
          path: target/${{ matrix.target }}/release/bundle/dmg/*.dmg
          if-no-files-found: error
          retention-days: 30

  package-windows:
    name: Windows NSIS package
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Build CLI sidecar
        shell: pwsh
        run: |
          $targetTriple = (rustc -vV | Select-String '^host:\s*(.+)$').Matches.Groups[1].Value
          if (-not $targetTriple) { throw 'Could not determine the Rust host target.' }
          cargo build --locked --release -p focuser-cli
          New-Item -ItemType Directory -Force crates/focuser-ui/binaries | Out-Null
          Copy-Item target/release/focuser-cli.exe "crates/focuser-ui/binaries/focuser-cli-$targetTriple.exe"

      - name: Stage Windows enforcement resources
        shell: pwsh
        run: |
          cargo build --locked --release -p focuser-service --bin focusguard-service --example scm_policy_probe
          cargo build --locked --release -p focuser-native
          New-Item -ItemType Directory -Force crates/focuser-ui/resources | Out-Null
          Copy-Item target/release/focusguard-service.exe crates/focuser-ui/resources/focusguard-service.exe
          Copy-Item target/release/focuser-native.exe crates/focuser-ui/resources/focuser-native.exe
          Copy-Item crates/focuser-ui/nsis/service-lifecycle.ps1 crates/focuser-ui/resources/service-lifecycle.ps1
          Copy-Item extension/identity.json crates/focuser-ui/resources/extension-identity.json

      - name: Install Tauri CLI
        shell: pwsh
        run: |
          $asset = 'cargo-tauri-x86_64-pc-windows-msvc.zip'
          $archive = Join-Path $env:RUNNER_TEMP $asset
          $url = "https://github.com/tauri-apps/tauri/releases/download/tauri-cli-v2.10.1/$asset"
          Invoke-WebRequest -Uri $url -OutFile $archive
          $expectedHash = '50a3ed1c43f75ea3b6e7233a52d8a7c994cfffd98d8545ff397db8b464338d9c'
          $actualHash = (Get-FileHash -LiteralPath $archive -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($actualHash -ne $expectedHash) { throw "Tauri CLI archive hash mismatch: $actualHash" }
          $installDir = Join-Path $env:RUNNER_TEMP 'tauri-cli'
          New-Item -ItemType Directory -Force $installDir | Out-Null
          Expand-Archive -LiteralPath $archive -DestinationPath $installDir -Force
          $tauriCli = Join-Path $installDir 'cargo-tauri.exe'
          if (-not (Test-Path -LiteralPath $tauriCli)) { throw 'The verified Tauri CLI archive has no cargo-tauri.exe.' }
          Add-Content -LiteralPath $env:GITHUB_PATH -Value $installDir
          & $tauriCli --version

      - name: Build unsigned NSIS package without updater artifacts
        working-directory: crates/focuser-ui
        shell: pwsh
        run: |
          cargo tauri build --bundles nsis --no-sign --ci --config '{"bundle":{"createUpdaterArtifacts":false,"resources":{"resources/focusguard-service.exe":"focusguard-service.exe","resources/focuser-native.exe":"focuser-native.exe","resources/service-lifecycle.ps1":"service-lifecycle.ps1","resources/extension-identity.json":"extension-identity.json"}}}'
          $packages = @(Get-ChildItem ../../target/release/bundle/nsis -File -Filter '*.exe')
          if ($packages.Count -ne 1) { throw "Expected one NSIS package, found $($packages.Count)." }
          if ($packages[0].Length -le 0) { throw 'The NSIS package is empty.' }
          Write-Output "Built unsigned Windows package: $($packages[0].Name) ($($packages[0].Length) bytes)"

      - name: Upload unsigned Windows installer
        uses: actions/upload-artifact@v4
        with:
          name: focusguard-windows-x64-unsigned-nsis
          path: target/release/bundle/nsis/FocusGuard_*_x64-setup.exe
          if-no-files-found: error
          retention-days: 30

      - name: Install, exercise recovery, and uninstall on disposable Windows runner
        shell: pwsh
        run: |
          $packages = @(Get-ChildItem target/release/bundle/nsis -File -Filter '*.exe')
          if ($packages.Count -ne 1) { throw "Expected one NSIS package, found $($packages.Count)." }
          ./scripts/windows-installer-smoke.ps1 -InstallerPath $packages[0].FullName
