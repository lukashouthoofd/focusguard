name: Windows service recovery

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/ci.yml'
      - '.github/workflows/windows-service-recovery.yml'
      - 'crates/focuser-app/**'
      - 'crates/focuser-client/**'
      - 'crates/focuser-common/**'
      - 'crates/focuser-core/**'
      - 'crates/focuser-service/**'
      - 'scripts/windows-service-recovery-smoke.ps1'

permissions:
  contents: read

concurrency:
  group: windows-service-recovery-${{ github.ref }}
  cancel-in-progress: true

jobs:
  windows-service-recovery:
    name: Windows SCM policy recovery (ephemeral runner only)
    runs-on: windows-2022
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Build isolated service and IPC probe
        run: cargo build --locked -p focuser-service --bin focusguard-service --example scm_policy_probe

      - name: Exercise LocalSystem SCM restart and policy reconciliation
        shell: pwsh
        run: ./scripts/windows-service-recovery-smoke.ps1
