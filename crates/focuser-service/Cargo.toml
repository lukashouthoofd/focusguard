[package]
name = "focuser-service"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "Windows and macOS service hosts with secured local IPC for FocusGuard"

[[bin]]
name = "focusguard-service"
path = "src/main.rs"

[dependencies]
anyhow.workspace = true
chrono.workspace = true
focuser-common.workspace = true
focuser-app.workspace = true
focuser-core.workspace = true
tokio.workspace = true
tracing.workspace = true
uuid.workspace = true

[dev-dependencies]
focuser-client.workspace = true
tempfile = "3.27.0"

[target.'cfg(windows)'.dependencies]
windows-service = "0.8.1"
windows-sys = { version = "0.61.2", features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_Security_Authorization",
    "Win32_Storage_FileSystem",
    "Win32_System_Pipes",
    "Win32_System_SystemInformation",
    "Win32_System_Threading",
] }

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target.'cfg(target_os = "macos")'.dependencies]
rusqlite = { workspace = true, features = ["backup"] }
